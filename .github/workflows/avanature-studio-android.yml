name: Build AvaNature Studio Android APK

on:
  push:
    branches: [avanature-v2]
    paths:
      - 'AvaNatureStudio/**'
      - '.github/workflows/avanature-studio-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build, lint and verify AvaNature Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate bundled offline ambience audio
        shell: bash
        run: |
          set -euo pipefail
          python3 AvaNatureStudio/tools/generate_offline_audio.py
          for f in AvaNatureStudio/app/src/main/res/raw/*.wav; do
            test -s "$f"
            test "$(stat -c%s "$f")" -gt 100000
            file "$f"
          done
      - name: Compile and lint
        run: gradle -p AvaNatureStudio --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK package metadata
        shell: bash
        run: |
          APK="AvaNatureStudio/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-studio-metadata.txt
          grep -q "package: name='com.avanature.soundscape.studio'" apk-studio-metadata.txt
          grep -q "application-label:'آواطبیعت استودیو'" apk-studio-metadata.txt
          head -20 apk-studio-metadata.txt
      - name: Upload installable Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: AvaNature-Studio-Android-APK
          path: AvaNatureStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
