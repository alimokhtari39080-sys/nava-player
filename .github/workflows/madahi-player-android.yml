name: Nava Madahi Plus Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'madahi-player/**'
      - 'madahi/src/main/assets/madahi/data/feed.json'
      - 'settings.gradle.kts'
      - '.github/workflows/madahi-player-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nava Madahi Plus APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Validate player JavaScript
        run: node --check madahi-player/src/main/assets/player/app.js

      - name: Build installable APK
        run: gradle --no-daemon :madahi-player:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nava-Madahi-Plus-Android-debug
          path: madahi-player/build/outputs/apk/debug/madahi-player-debug.apk
          if-no-files-found: error
          retention-days: 30
