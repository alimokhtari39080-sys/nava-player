name: Refresh Madahi catalog

on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'madahi/data/sources.json'
      - 'madahi/scripts/update-feed.mjs'
      - '.github/workflows/madahi-feed.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh YouTube RSS catalog
        run: node madahi/scripts/update-feed.mjs

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add madahi/src/main/assets/madahi/data/feed.json
          if git diff --cached --quiet; then
            echo "No new recitations found."
          else
            git commit -m "chore(madahi): refresh recitation catalog"
            git push
          fi
