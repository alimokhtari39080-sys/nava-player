name: Refresh Madahi catalog

on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'madahi/data/sources.json'
      - 'madahi/scripts/update-feed.mjs'
      - '.github/workflows/madahi-feed.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh and publish catalog safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Refresh attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            node madahi/scripts/update-feed.mjs
            git add madahi/src/main/assets/madahi/data/feed.json

            if git diff --cached --quiet; then
              echo "No new recitations found."
              exit 0
            fi

            git commit -m "chore(madahi): refresh recitation catalog"
            if git push origin HEAD:main; then
              echo "Catalog published successfully."
              exit 0
            fi

            echo "The branch changed during push; retrying from latest main."
            sleep "$((attempt * 3))"
          done

          echo "::error::Could not publish catalog after five attempts."
          exit 1
