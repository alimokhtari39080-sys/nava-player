name: Nava Madahi Pro Android APK
on:
  push:
    branches: [ main ]
    paths:
      - 'madahi-pro/**'
      - 'settings.gradle.kts'
      - '.github/workflows/madahi-pro-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - run: node --check madahi-pro/src/main/assets/player/app.js
      - run: gradle --no-daemon :madahi-pro:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nava-Madahi-Pro-Android-debug
          path: madahi-pro/build/outputs/apk/debug/madahi-pro-debug.apk
          if-no-files-found: error
          retention-days: 30
