name: Build AvaNature Android APK

on:
  push:
    branches: [avanature]
    paths:
      - 'AvaNature-Source.tar.xz'
      - '.github/workflows/avanature-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AvaNature debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract the standalone app project
        run: mkdir -p nature-sounds && tar -xJf AvaNature-Source.tar.xz -C nature-sounds

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK
        run: gradle -p nature-sounds --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AvaNature-Android-APK
          path: nature-sounds/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
