<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171321">
<title>در حال باز کردن کارتینو</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171321;color:#f8f0df;font:16px Tahoma,sans-serif}.box{text-align:center;padding:28px;line-height:2}</style>
</head>
<body>
<div class="box">✦<br>در حال باز کردن کارت شما...</div>
<script>
(function(){
 const match=location.pathname.match(/\/c\/([A-Za-z0-9]{10})\/?$/);
 if(match){
   const root=location.pathname.replace(/\/c\/[A-Za-z0-9]{10}\/?$/,"");
   location.replace(root+"/cardino-web/view.html?c="+match[1]);
 }else{
   document.querySelector(".box").textContent="این لینک کارتینو معتبر نیست.";
 }
})();
</script>
</body>
</html>
